<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NOVA Windows Patching Automation Dashboard — Autonomous patch management for enterprise Windows servers" />
    <title>NOVA | Windows Patching Automation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f6cbd" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('NOVA-enterprise-theme') === 'dark') theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- CDK brand font: Montserrat Light / Regular / Medium / Bold (Arial fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
